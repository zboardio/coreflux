          summary: '{{ $labels.plc_id }}: {{ index $values "A" }} fault signal(s) — OB80 calls, a recorded fault, or a boot after one'
          description: 'Sum of: OB80 calls in the last 10 min (ring), and a boot in the last hour whose previous boot ended with OB80/82/86 counts; an S7-1200 with the kit''s error OBs does not stop on a fault, so nothing is recorded before a STOP. The error OBs table on PLC detail says which OB was called, with Siemens'' meaning; the boots table how a boot ended. Clears an hour after the event.'

      - uid: plc_records_lost-s7-1200
        title: 'S7-1200: PLC records lost — Seq gaps'
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            datasourceUid: timescale-edge
            relativeTimeRange: { from: 7200, to: 0 }
            model:
              refId: A
              format: table
              rawQuery: true
              editorMode: code
              rawSql: >-
                SELECT r.plc_id, coalesce(sum(g.missing), 0)::float AS records_lost
                FROM plc_registry r LEFT JOIN (
                  SELECT plc_id, next_seq - seq - 1 AS missing
                  FROM (SELECT plc_id, seq, lead(seq) OVER (PARTITION BY plc_id, boot_date, boot_time ORDER BY seq) AS next_seq
                        FROM plc_cycle WHERE ts_plc > now() - interval '2 hours' AND plc_id IN (SELECT fr.plc_id FROM plc_registry fr LEFT JOIN plc_model fm ON fm.model = fr.model WHERE coalesce(fr.family, fm.family) = 's7-1200')) s
                  WHERE next_seq - seq > 1) g ON g.plc_id = r.plc_id
                WHERE r.plc_id IN (SELECT fr.plc_id FROM plc_registry fr LEFT JOIN plc_model fm ON fm.model = fr.model WHERE coalesce(fr.family, fm.family) = 's7-1200')
                GROUP BY r.plc_id
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { params: [0], type: gt }
        labels:
          severity: warning
          domain: plc
          team: infra
          family: s7-1200
        annotations:
          __dashboardUid__: plc-detail-s7-1200
          __panelId__: '521'
          drilldown: 'd/plc-detail-s7-1200?var-plc={{ $labels.plc_id }}&viewPanel=panel-521'
          summary: '{{ $labels.plc_id }}: {{ index $values "A" }} DB_PerfMon record(s) lost in the last 2 h'
          description: 'Seq gaps within one boot: the reader was away longer than the ring holds (120 records = 2 min at a 1 s window), or a record was refused (bad stamp). The gaps table on PLC detail lists them exactly; the reads panels show which path was down. Clears when the gap is 2 h old.'

      - uid: plc_clock_skew-s7-1200
        title: 'S7-1200: PLC clock skew beyond 10 s'
        condition: B
        for: 10m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            datasourceUid: timescale-edge
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              format: table
              rawQuery: true
              editorMode: code
              rawSql: >-
                SELECT plc_id, min(extract(epoch FROM ts_received - ts_plc))::float AS skew_s
                FROM plc_cycle WHERE ts_plc > now() - interval '2 days' AND ts_received > now() - interval '10 minutes'
                  AND plc_id IN (SELECT fr.plc_id FROM plc_registry fr LEFT JOIN plc_model fm ON fm.model = fr.model WHERE coalesce(fr.family, fm.family) = 's7-1200')
                GROUP BY plc_id
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { params: [-10, 10], type: outside_range }
        labels:
          severity: warning
          domain: plc
          team: infra
          family: s7-1200
        annotations:
          __dashboardUid__: plc-detail-s7-1200
          __panelId__: '313'
          drilldown: 'd/plc-detail-s7-1200?var-plc={{ $labels.plc_id }}&viewPanel=panel-313'
          summary: '{{ $labels.plc_id }}: CPU clock off by {{ index $values "A" }} s'
          description: 'Read time minus the newest PLC stamp, expected at 0–1 s. Hours = the CPU clock is not on UTC: set it, or record the zone in plc_registry.clock_zone. A steady drift = the CPU clock needs a time source. Records are keyed by the PLC stamp, so a clock that jumps back can collide with old keys.'

      - uid: plc_health_stalled-s7-1200
        title: 'S7-1200: PLC health loop stalled on a path — Life not confirmed while Seq moves'
        condition: B
        for: 1m
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            datasourceUid: timescale-edge
            relativeTimeRange: { from: 600, to: 0 }
            model:
              refId: A
              format: table
              rawQuery: true
              editorMode: code
              rawSql: >-
                SELECT h.plc_id, h.slot,
                CASE WHEN EXISTS (SELECT 1 FROM plc_cycle c WHERE c.plc_id = h.plc_id AND c.ts_plc > now() - interval '2 days'
                                  AND c.ts_received > now() - interval '90 seconds')
                     THEN h.age_s ELSE 0 END::float AS age_s
                FROM (SELECT DISTINCT ON (h.plc_id, h.slot) h.plc_id, h.slot, h.age_s FROM plc_health h
                      JOIN plc_registry r ON r.plc_id = h.plc_id AND h.slot = ANY (r.paths)
                      WHERE h.ts > now() - interval '5 minutes' AND r.plc_id IN (SELECT fr.plc_id FROM plc_registry fr LEFT JOIN plc_model fm ON fm.model = fr.model WHERE coalesce(fr.family, fm.family) = 's7-1200') ORDER BY h.plc_id, h.slot, h.ts DESC) h
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { params: [15], type: gt }
        labels:
          severity: warning
          domain: plc
          team: infra
          family: s7-1200
        annotations:
          __dashboardUid__: plc-detail-s7-1200
          __panelId__: '310'
          drilldown: 'd/plc-detail-s7-1200?var-plc={{ $labels.plc_id }}&viewPanel=panel-310'
          summary: '{{ $labels.plc_id }}: health loop stalled on {{ $labels.slot }} — Life unconfirmed for {{ index $values "A" }} s'
          description: 'The PLC has not seen its Life value echoed on {{ $labels.slot }} while records keep arriving: data flows PLC → broker, but the way back is broken — writes refused (write protection, NetLink access list) or the broker''s echo action died Check the action in the Coreflux Hub.'

      - uid: plc_health_corrupt-s7-1200
        title: 'S7-1200: PLC health loop corrupt — BadEcho rose'
        condition: B
        for: 0s
        noDataState: OK
        execErrState: Error
        data:
          - refId: A
            datasourceUid: timescale-edge
            relativeTimeRange: { from: 900, to: 0 }
            model:
              refId: A
              format: table
              rawQuery: true
              editorMode: code
              rawSql: >-
                SELECT h.plc_id, h.slot,
                greatest(0, (array_agg(h.bad_echo ORDER BY h.ts DESC))[1] - (array_agg(h.bad_echo ORDER BY h.ts))[1])::float AS bad_echo_rise
                FROM plc_health h JOIN plc_registry r ON r.plc_id = h.plc_id AND h.slot = ANY (r.paths)
                WHERE h.ts > now() - interval '15 minutes' AND r.plc_id IN (SELECT fr.plc_id FROM plc_registry fr LEFT JOIN plc_model fm ON fm.model = fr.model WHERE coalesce(fr.family, fm.family) = 's7-1200') GROUP BY h.plc_id, h.slot
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { params: [0], type: gt }
        labels:
          severity: critical
          domain: plc
          team: infra
          family: s7-1200
        annotations:
          __dashboardUid__: plc-detail-s7-1200
          __panelId__: '311'
          drilldown: 'd/plc-detail-s7-1200?var-plc={{ $labels.plc_id }}&viewPanel=panel-311'
          summary: '{{ $labels.plc_id }}: {{ index $values "A" }} bad echo(es) on {{ $labels.slot }} in 15 min'
          description: 'The PLC received a value on Echo that was neither its current nor its previous Life: a second writer, a replayed message or a wrong address. It falsifies this signal only — the kit writes nothing else — but find the writer: which accounts and rules let a client publish to the Echo topic.'
