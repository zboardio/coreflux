              rawSql: >-
                SELECT plc_id, coalesce(extract(epoch FROM now() - plc_last_ok(plc_id)), 86400)::float AS seconds_since_ok_read
                FROM plc_registry WHERE plc_id IN (SELECT fr.plc_id FROM plc_registry fr LEFT JOIN plc_model fm ON fm.model = fr.model WHERE coalesce(fr.family, fm.family) = 's7-1500')
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: { from: 0, to: 0 }
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator: { params: [90], type: gt }
        labels:
          severity: critical
          domain: plc
          team: infra
          family: s7-1500
        annotations:
