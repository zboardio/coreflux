# A drop-in for the coordinator's DEVICE unit: wait for the dongle without a time limit.
# Install as /etc/systemd/system/dev-zigbee.device.d/zigbee-replug-wait.conf, then
#   sudo systemctl daemon-reload
# Check it with: systemctl show dev-zigbee.device -p JobRunningTimeoutUSec   (expect: infinity)
#
# Why: when the dongle is pulled, Z2M exits on its own (code 2) and Restart=always queues a restart
# that waits for dev-zigbee.device. systemd gives a device 90 s (DefaultDeviceTimeoutSec). After that
# the restart fails as "Dependency failed", Restart= does not retry it, and a later replug starts
# nothing: Z2M stays down until someone starts it by hand. With no timeout the queued restart simply
# waits and completes the moment the dongle is back, however long it was out.
#
# Safe only because nothing at boot waits for this job: zigbee2mqtt.service is
# WantedBy=dev-zigbee.device, not multi-user.target. Never put that unit under a boot target while
# this file exists: a boot without the dongle would never reach that target.
#
# The same key systemd's fstab generator writes for x-systemd.device-timeout=.
[Unit]
JobRunningTimeoutSec=infinity
